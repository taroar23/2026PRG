{% extends "base.html" %}

{% block title %}Voik — Iniciar Sesión{% endblock %}

{% block content %}
<div class="form-container-centered">
    <h2 class="form-title">Iniciar Sesión</h2>
    
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username" class="form-label">Usuario o Correo Electrónico</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="nombre_usuario o correo@ejemplo.com" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="submit-btn">Ingresar</button>
    </form>
    
    <p class="form-link-text">
        ¿No tienes cuenta? <a href="/registro">Registrarse</a>
    </p>
</div>
{% endblock %}
